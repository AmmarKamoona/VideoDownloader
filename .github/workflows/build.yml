name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'          # built-in Gradle cache — no separate setup-gradle needed

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Chaquopy artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/chaquopy
            app/build/python
          key: chaquopy-${{ hashFiles('app/build.gradle.kts', 'app/src/main/python/**') }}
          restore-keys: chaquopy-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found after build"
            exit 1
          fi
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          SIZE=$(du -h "$APK" | cut -f1)
          echo "APK_SIZE=$SIZE" >> $GITHUB_ENV
          echo "## ✅ APK built successfully" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| File  | $(basename $APK) |" >> $GITHUB_STEP_SUMMARY
          echo "| Size  | $SIZE |" >> $GITHUB_STEP_SUMMARY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: legend-video-downloader-debug
          path: ${{ env.APK_PATH }}
          retention-days: 30
          if-no-files-found: error   # fail loudly if APK is missing

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
